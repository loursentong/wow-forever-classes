name: Validation du matching
on:
  pull_request:
  push:
    branches: [main]

jobs:
  skill-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les fichiers réellement publiés sur GitHub Pages
        run: bash scripts/prepare-pages.sh
      - name: Vérifier les sources d'icônes officielles (diagnostic)
        run: node scripts/asset-source-check.cjs
        continue-on-error: true
      - name: Tester le modèle, les graphiques et les interactions
        run: node --test tests/*.test.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test driver
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test live questionnaire interactions and mobile layout
        run: node tests/browser-smoke.cjs
      - name: Diagnose current GitHub Pages production assets
        run: node tests/pages-live-check.cjs
        continue-on-error: true
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questionnaire-preview
          path: tests/screenshots/*.png
          if-no-files-found: ignore
