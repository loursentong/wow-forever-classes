name: Validation du matching
on:
  pull_request:
  push:
    branches: [main]

jobs:
  skill-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester le modèle, les graphiques et les interactions
        run: node --test tests/skill-matching.test.cjs
