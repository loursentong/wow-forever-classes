name: Publier sur GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Configurer Pages
        uses: actions/configure-pages@v6
      - name: Préparer et vérifier le site complet
        run: bash scripts/prepare-pages.sh
      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Vérifier la publication HTML et JavaScript
        run: node scripts/verify-pages-live.cjs
